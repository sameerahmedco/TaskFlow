# Example only. Replace example.org, root, PHP-FPM socket and TLS configuration.
server {
    listen 443 ssl http2;
    server_name tasks.example.org;
    root /srv/taskflow;
    index index.php;
    # Configure ssl_certificate and ssl_certificate_key via your certificate manager.
    # Apply headers at TLS edge and keep TLS configuration current.

    location ~ (^|/)(?:config|includes|bin|tests|docs|\.git|\.github)(/|$) { deny all; }
    location ~ (^|/)\.(?!well-known) { deny all; }
    location ~* \.(?:sql|md|log|bak|env|ini|yml|yaml|zip)$ { deny all; }
    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
