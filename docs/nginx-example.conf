# Compatibility example; use docs/deployment/nginx-taskflow.conf.example in new installs.
# TaskFlow v3 Nginx/PHP-FPM example. Copy to your HTTPS server configuration.
# Replace the hostname, paths, TLS certificate locations, and FPM socket.
# Do not use `php -S` for an internet-accessible installation.
server {
    listen 443 ssl;
    server_name tasks.example.com;
    root /var/www/taskflow;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/tasks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasks.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 10m;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # These paths may contain source, setup material, screenshots, history or secrets.
    # The location must appear BEFORE the general PHP handler below.
    location ~* ^/(?:config|includes|bin|tests|docs|\.git|\.github)(?:/|$) {
        return 404;
    }
    location ~* (^|/)\. { return 404; }
    location ~* \.(?:sql|md|log|bak|ini|env|yml|yaml|lock|zip)(?:\.(?:gz|bak|old))?$ {
        return 404;
    }

    # Point ACME challenge files to a directory outside the application root.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    # Files are served with the versioned URL in TaskFlow's generated HTML.
    # Short bounded caching helps without hiding critical fixes for long periods.
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        # Do not add location-specific add_header directives: doing so would
        # suppress the server-level HSTS/frame/referrer security headers.
        expires 1h;
        try_files $uri =404;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }
}
# Redirect HTTP requests at the edge, while making sure ACME renewal works.
server {
    listen 80;
    server_name tasks.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://tasks.example.com$request_uri; }
}
